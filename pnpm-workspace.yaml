allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
minimumReleaseAge: 1440
# 上流が脆弱なバージョンを exact pin している間接依存を修正版へ上げる。
# 上流が修正版に上げたら削除する。
overrides:
  # @node-minify/core (via @opennextjs/aws) pins glob 10.3.3 (GHSA-5j98-mcp5-4vw2)
  "@node-minify/core>glob": ^10.5.0
  # miniflare (via wrangler) pins undici 7.29.1 (GHSA-4qv8-2p9j-2685 ほか)
  "miniflare>undici": ^7.30.1
